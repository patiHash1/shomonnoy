<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Project Shomonnoy — Balancing Screen Time & Real Life</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/jpeg" href="assets/project_shmonnoy.jpg">

  <!-- Prefetch/Preconnect Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide icons script -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.372.0/dist/umd/lucide.min.js" defer></script>

  <!-- Prevent light/dark theme flash on initial load -->
  <script>
    (function() {
      const cached = localStorage.getItem('theme');
      const activeTheme = cached === 'light' || cached === 'dark' 
        ? cached 
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', activeTheme);
      window.preloaderStartTime = Date.now();
    })();
  </script>

  <style>
    /* Immediate theme variables for index preloader */
    :root {
      --bg-base: #ffffff;
      --primary: #4f46e5;
      --accent: #06b6d4;
      --text-primary: #0f172a;
      --text-muted: #94a3b8;
    }
    [data-theme="dark"] {
      --bg-base: #080d1a;
      --primary: #6366f1;
      --accent: #06b6d4;
      --text-primary: #f1f5f9;
      --text-muted: #64748b;
    }

    /* Preloader styling */
    .initial-preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-base);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      font-family: 'Inter', sans-serif;
      transition: background-color 0.3s ease, opacity 0.5s ease, visibility 0.5s ease;
      opacity: 1;
      visibility: visible;
    }

    .initial-preloader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .preloader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .preloader-logo-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .preloader-logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      z-index: 2;
    }

    .preloader-ring {
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--primary);
      border-bottom-color: var(--accent);
      animation: spin 1.5s linear infinite;
      z-index: 1;
    }

    .preloader-brand {
      font-family: 'Baloo 2', 'Inter', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .preloader-bar {
      width: 180px;
      height: 6px;
      background-color: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
      position: relative;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.06);
    }
    
    [data-theme="dark"] .preloader-bar {
      background-color: rgba(255, 255, 255, 0.06);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    .preloader-progress {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent), var(--primary));
      background-size: 200% 100%;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.65),
                  0 0 4px rgba(6, 182, 212, 0.4);
      animation: progressAnim 2s cubic-bezier(0.25, 1, 0.5, 1) infinite, shimmer 2s linear infinite;
    }

    .preloader-text {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes progressAnim {
      0% {
        transform: translateX(-100%);
      }
      50% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(100%);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }
  </style>
</head>
<body>
  <app-root></app-root>

  <div id="preloader" class="initial-preloader">
    <div class="preloader-content">
      <div class="preloader-logo-wrapper">
        <img src="assets/project_shmonnoy.jpg" alt="Logo" class="preloader-logo">
        <div class="preloader-ring"></div>
      </div>
      <h2 class="preloader-brand">Shomonnoy</h2>
      <div class="preloader-bar">
        <div class="preloader-progress"></div>
      </div>
      <p class="preloader-text">Balancing screen time & real life...</p>
    </div>
  </div>

  <script>
    (function() {
      const preloader = document.getElementById('preloader');
      const appRoot = document.querySelector('app-root');
      
      function hidePreloader() {
        const elapsed = Date.now() - window.preloaderStartTime;
        const remaining = Math.max(0, 3000 - elapsed);
        
        setTimeout(function() {
          preloader.classList.add('fade-out');
          setTimeout(function() {
            preloader.remove();
          }, 500);
        }, remaining);
      }
      
      if (appRoot) {
        const observer = new MutationObserver(function(mutations, obs) {
          if (appRoot.children.length > 0) {
            hidePreloader();
            obs.disconnect();
          }
        });
        observer.observe(appRoot, { childList: true });
      } else {
        window.addEventListener('load', hidePreloader);
      }
    })();
  </script>
</body>
</html>
