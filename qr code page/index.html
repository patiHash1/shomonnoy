<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Shomonnoy - Scan for Balance</title>
  <meta name="description" content="Scan the QR code to visit Project Shomonnoy and discover the balance between screen time and real life.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* CSS Reset & Variable Definitions */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    :root {
      --bg: #070a13;
      --card-bg: rgba(15, 22, 42, 0.65);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --accent: #06b6d4;
      --accent-glow: rgba(6, 182, 212, 0.35);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }
    
    /* Elegant Glowing Background Orbs */
    body::before, body::after {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      z-index: -1;
      filter: blur(150px);
      opacity: 0.25;
      pointer-events: none;
      animation: floatOrbs 12s infinite alternate ease-in-out;
    }
    
    body::before {
      background: var(--primary);
      top: -100px;
      left: -100px;
    }
    
    body::after {
      background: var(--accent);
      bottom: -100px;
      right: -100px;
      animation-delay: -6s;
    }
    
    @keyframes floatOrbs {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(80px, 50px) scale(1.1);
      }
    }
    
    /* Layout Header */
    header {
      padding: 40px 20px 20px;
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeInDown 0.8s ease;
    }
    
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    
    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }
    
    .brand-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 30%, var(--text-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    /* Main Content Container */
    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      width: 100%;
      max-width: 600px;
      z-index: 1;
    }
    
    /* Premium Glass Card */
    .qr-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px;
      width: 100%;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3),
                  inset 0 1px 1px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transform: translateY(0);
      transition: var(--transition);
      animation: scaleIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .qr-card:hover {
      transform: translateY(-6px);
      border-color: rgba(99, 102, 241, 0.25);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
                  0 0 40px var(--primary-glow),
                  inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }
    
    /* Glowing Title */
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .lead-text {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 30px;
      max-width: 440px;
    }
    
    /* QR Frame with glowing effects */
    .qr-frame {
      position: relative;
      background: #ffffff;
      padding: 16px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      margin-bottom: 30px;
      transition: var(--transition);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .qr-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 20px;
      padding: 3px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: var(--transition);
    }
    
    .qr-card:hover .qr-frame::before {
      opacity: 1;
    }
    
    .qr-image {
      display: block;
      width: 240px;
      height: 240px;
      object-fit: contain;
      border-radius: 10px;
      transition: var(--transition);
    }
    
    .qr-card:hover .qr-image {
      transform: scale(1.02);
    }
    

    /* CTA Actions */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }
    
    .btn {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 14px 24px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: var(--transition);
      border: none;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary) 60%, #4f46e5);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
    }
    
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      border: 1px solid var(--border);
    }
    
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }
    
    /* Custom Toast Tooltip */
    .toast {
      position: fixed;
      bottom: -60px;
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
      opacity: 0;
      z-index: 100;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .toast.show {
      transform: translateY(-80px);
      opacity: 1;
    }
    
    /* Footer Area */
    footer {
      padding: 30px 20px 40px;
      text-align: center;
      width: 100%;
      animation: fadeInUp 0.8s ease;
    }
    
    .footer-motto {
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 8px;
    }
    
    .footer-copyright {
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    
    .footer-copyright a {
      color: var(--accent);
      text-decoration: none;
      transition: var(--transition);
    }
    
    .footer-copyright a:hover {
      text-decoration: underline;
    }
    
    /* Keyframe Animations */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    /* Responsive Adaptations */
    @media (max-width: 480px) {
      .qr-card {
        padding: 30px 20px;
        border-radius: 24px;
      }
      h1 {
        font-size: 1.8rem;
      }
      .qr-image {
        width: 200px;
        height: 200px;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="https://shomonnoy.vercel.app/" class="brand" target="_blank" rel="noopener noreferrer">
      <img src="../src/assets/patiHash_logo.jpg" alt="patiHash Logo" class="brand-logo" onerror="this.src='shomonnoy-qr.png'; this.style.borderColor='transparent';">
      <span class="brand-name">Shomonnoy</span>
    </a>
  </header>

  <main>
    <div class="qr-card">
      <h1>Scan for Balance</h1>
      <p class="lead-text">Discover a healthier relationship between screen time and real life. Peer-led workshops, resources, and custom habits designed for Grade 6 & 7 students.</p>
      
      <div class="qr-frame">
        <img class="qr-image" src="shomonnoy-qr.png" alt="Project Shomonnoy QR Code">
      </div>
      
      <div class="button-group">
        <a href="https://shomonnoy.vercel.app/" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
          <span>Visit Website</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
        </a>
        <button id="copyBtn" class="btn btn-secondary">
          <span>Copy Website Link</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
      </div>
    </div>
  </main>

  <div id="toast" class="toast">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
    <span>Link copied successfully!</span>
  </div>

  <footer>
    <div class="footer-motto">Build by patiHash with ❤️</div>
    <div class="footer-copyright">
      &copy; 2026 Project Shomonnoy &bull; Powered by <a href="https://www.patihash.com/" target="_blank" rel="noopener noreferrer">patiHash</a>
    </div>
  </footer>

  <script>
    const copyBtn = document.getElementById('copyBtn');
    const toast = document.getElementById('toast');
    
    copyBtn.addEventListener('click', () => {
      const url = 'https://shomonnoy.vercel.app/';
      
      navigator.clipboard.writeText(url).then(() => {
        // Show custom toast notification
        toast.classList.add('show');
        
        // Hide after 3 seconds
        setTimeout(() => {
          toast.classList.remove('show');
        }, 3000);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    });
  </script>
</body>
</html>
